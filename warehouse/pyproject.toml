[project]
name = "aventyrs-warehouse"
version = "0.1.0"
description = "Loads the API's analytics_events from MongoDB into a denormalized DuckDB combat warehouse"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5,<1.6",  # same storage family as the Metabase driver (warehouse/metabase/Dockerfile)
    "pymongo>=4.10,<5",
    "pytz",  # duckdb needs it to hand TIMESTAMPTZ values (the extract watermark) to Python
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aventyrs-wh = "aventyrs_wh.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aventyrs_wh"]

[tool.setuptools.package-data]
aventyrs_wh = ["models/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
