databaseChangeLog:
  - changeSet:
      id: 001-create-items-collection
      author: aventyrs-api
      changes:
        - createCollection:
            collectionName: items
  - changeSet:
      id: 002-create-items-produced-by-character-id-index
      author: aventyrs-api
      changes:
        - createIndex:
            collectionName: items
            keys: '{ "producedByCharacterId": 1 }'
            options: '{ "name": "ix_items_produced_by_character_id" }'
