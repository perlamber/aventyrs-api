spring.application.name=aventyrs-api

server.port=27018

# Default profile for a bare `./gradlew bootRun` / `java -jar`. Production runs with
# SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod), which replaces this value.
# The active profiles double as Liquibase contexts (see MongoLiquibaseRunner): changesets tagged
# `context: dev` — the fake seed players/sheets/scene and the seeded GM — only apply under dev.
spring.profiles.active=dev

spring.mongodb.representation.uuid=standard

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Every accepted realtime Scene frame is also written to analytics_events for the warehouse/ job
# (see AnalyticsRecorder). Off switch, should it ever need one; recording failures never reach play.
aventyrs.analytics.enabled=true
