# Players log in with a password now (POST /api/auth/login). PlayerDocument.passwordHash holds a
# BCrypt hash; accounts are provisioned by a database administrator, e.g.
#
#   htpasswd -bnBC 10 "" 'the-password' | tr -d ':\n'
#   db.players.updateOne({ login: "someone" }, { $set: { passwordHash: "<hash>" } })
#
# ($2y$ hashes from htpasswd are accepted as-is.) There is no schema change — a player without a
# hash simply can't log in — so the only changeset gives the dev seed players a password equal to
# their login, matching 004-dev-seed-data.yaml and staying out of any real environment.
databaseChangeLog:
  - changeSet:
      id: 001-dev-seed-player-passwords
      author: aventyrs-api
      context: dev
      changes:
        - runCommand:
            command: >
              {
                update: "players",
                updates: [
                  {
                    q: { "_id": "11111111-1111-1111-1111-111111111111" },
                    u: { $set: { "passwordHash": "$2a$10$pbAPECNBqqQvXb.c8Dmt6uwD3H04O45zAL7tObid1XT4eQj58F9Vu" } }
                  },
                  {
                    q: { "_id": "22222222-2222-2222-2222-222222222222" },
                    u: { $set: { "passwordHash": "$2a$10$oz0DRdOFzqpuczKT6raqwOS.WITzc9aF6AyKHVEDXEP0fCHpTgXBS" } }
                  },
                  {
                    q: { "_id": "33333333-3333-3333-3333-333333333333" },
                    u: { $set: { "passwordHash": "$2a$10$O5XrpLK4obNZjUEVfJmwiuGub2K5hwZ0HcNwVEid/mZqyRiht5zp6" } }
                  }
                ]
              }
