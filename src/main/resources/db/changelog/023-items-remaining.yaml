            command: >
              {
                "update": "items",
                "updates": [
                  {
                    "q": {},
                    "u": [
                      {
                        "$set": {
                          "improvements": {
                            "$filter": {
                              "input": {
                                "$ifNull": [
                                  "$improvements",
                                  []
                                ]
                              },
                              "as": "imp",
                              "cond": {
                                "$ne": [
                                  "$$imp.definition",
                                  "ENCAIXE"
                                ]
                              }
                            }
                          },
                          "powerStone": null
                        }
                      }
                    ],
                    "multi": true
                  }
                ]
              }
