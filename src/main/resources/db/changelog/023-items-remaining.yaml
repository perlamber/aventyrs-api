  - changeSet:
      id: 003-campaign-bag-encaixe-and-stones
      author: aventyrs-api
      comment: Strip Encaixe; split socketed stones into bag entries
      changes:
        - runCommand:
            command: >
              {
                "update": "campaigns",
                "updates": [
                  {
                    "q": {
                      "bag.0": {
                        "$exists": true
                      }
                    },
                    "u": [
                      {
                        "$set": {
                          "bag": {
                            "$concatArrays": [
                              {
                                "$map": {
                                  "input": "$bag",
                                  "as": "b",
                                  "in": {
                                    "$mergeObjects": [
                                      "$$b",
                                      {
                                        "item": {
                                          "$mergeObjects": [
                                            "$$b.item",
                                            {
                                              "improvements": {
                                                "$filter": {
                                                  "input": {
                                                    "$ifNull": [
                                                      "$$b.item.improvements",
                                                      []
                                                    ]
                                                  },
                                                  "as": "imp",
                                                  "cond": {
                                                    "$ne": [
                                                      "$$imp.definition",
                                                      "ENCAIXE"
                                                    ]
                                                  }
                                                }
                                              },
                                              "powerStone": {
                                                "$cond": [
                                                  {
                                                    "$eq": [
                                                      "$$b.item.category",
                                                      "POWER_STONE"
                                                    ]
                                                  },
                                                  "$$b.item.powerStone",
                                                  null
                                                ]
                                              }
                                            }
                                          ]
                                        }
                                      }
                                    ]
                                  }
                                }
                              },
                              {
                                "$map": {
                                  "input": {
                                    "$filter": {
                                      "input": "$bag",
                                      "as": "b",
                                      "cond": {
                                        "$and": [
                                          {
                                            "$ne": [
                                              {
                                                "$ifNull": [
                                                  "$$b.item.powerStone",
                                                  null
                                                ]
                                              },
                                              null
                                            ]
                                          },
                                          {
                                            "$ne": [
                                              "$$b.item.category",
                                              "POWER_STONE"
                                            ]
                                          }
                                        ]
                                      }
                                    }
                                  },
                                  "as": "b",
                                  "in": {
                                    "id": {
                                      "$concat": [
                                        "$$b.id",
                                        "-stone"
                                      ]
                                    },
                                    "sourceName": "$$b.sourceName",
                                    "addedAt": "$$b.addedAt",
                                    "item": {
                                      "$let": {
                                        "vars": {
                                          "it": "$$b.item"
                                        },
                                        "in": {
                                          "templateName": null,
                                          "name": "$$it.powerStone.type",
                                          "description": "",
                                          "category": "POWER_STONE",
                                          "rarity": {
                                            "$switch": {
                                              "branches": [
                                                {
                                                  "case": {
                                                    "$eq": [
                                                      "$$it.powerStone.quality",
                                                      "JOLDA"
                                                    ]
                                                  },
                                                  "then": "UNCOMMON"
                                                },
                                                {
                                                  "case": {
                                                    "$eq": [
                                                      "$$it.powerStone.quality",
                                                      "JOIA"
                                                    ]
                                                  },
                                                  "then": "RARE"
                                                },
                                                {
                                                  "case": {
                                                    "$eq": [
                                                      "$$it.powerStone.quality",
                                                      "RELIQUIA"
                                                    ]
                                                  },
                                                  "then": "EPIC"
                                                }
                                              ],
                                              "default": "MYTHIC"
                                            }
                                          },
                                          "weightClass": "LIGHT",
                                          "price": 0,
                                          "physicalDefenseBonus": 0,
                                          "magicDefenseBonus": 0,
                                          "hardness": 0,
                                          "damageTaken": 0,
                                          "castingBonus": 0,
                                          "favor": null,
                                          "masterpiece": null,
                                          "improvements": [],
                                          "powerStone": {
                                            "type": "$$it.powerStone.type",
                                            "quality": "$$it.powerStone.quality",
                                            "masterpiece": {
                                              "$ifNull": [
                                                "$$it.powerStone.masterpiece",
                                                null
                                              ]
                                            },
                                            "improvement": {
                                              "$cond": [
                                                {
                                                  "$ne": [
                                                    {
                                                      "$ifNull": [
                                                        "$$it.powerStone.masterpiece",
                                                        null
                                                      ]
                                                    },
                                                    null
                                                  ]
                                                },
                                                {
                                                  "$ifNull": [
                                                    "$$it.powerStone.improvement",
                                                    null
                                                  ]
                                                },
                                                null
                                              ]
                                            },
                                            "remainingCharges": null,
                                            "lastChanceUsed": false
                                          },
                                          "regaliaGrade": null,
                                          "activeAbilityName": null,
                                          "donatedByAventyr": false,
                                          "quantity": 1,
                                          "loadedProjectiles": []
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            ]
                          }
                        }
                      }
                    ],
                    "multi": true
                  }
                ]
              }
  - changeSet:
      id: 004-items-encaixe-and-stones
      author: aventyrs-api
      comment: Strip Encaixe and socketed stones from GM items
      changes:
