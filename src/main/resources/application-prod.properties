# Production. Same endpoints as dev for now; every value can be overridden through the
# environment without a rebuild. Dev-context Liquibase changesets (seed data) never run here.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/aventyrs?replicaSet=rs0}

seaweedfs.filer-url=${SEAWEEDFS_FILER_URL:http://localhost:8888}
seaweedfs.s3.endpoint=${SEAWEEDFS_S3_ENDPOINT:http://localhost:8333}
seaweedfs.s3.access-key=${AWS_ACCESS_KEY_ID:admin}
seaweedfs.s3.secret-key=${AWS_SECRET_ACCESS_KEY:secret}
seaweedfs.s3.bucket=${S3_BUCKET:my-bucket}

# No default: the API refuses to start without a JWT_SECRET of at least 32 bytes
# (e.g. `openssl rand -base64 48`).
aventyrs.security.jwt.secret=${JWT_SECRET}
aventyrs.security.jwt.ttl=${JWT_TTL:12h}

# Logging: INFO and above. AVENTYRS_LOG_LEVEL=DEBUG in /etc/aventyrs/aventyrs.env raises the
# app's own loggers for a diagnosis (restart, no rebuild). The console (journald) stays plain text;
# the file is one JSON object per event, stack trace included, tailed into Dozzle by the api-logs
# container (docker-compose.yml). Read it through scripts/prod-logs.sh.
logging.level.root=INFO
logging.level.org.aventyrs=${AVENTYRS_LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE:/opt/aventyrs/logs/aventyrs-api.log}
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
