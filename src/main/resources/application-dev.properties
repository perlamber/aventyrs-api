# Local development: docker-compose Mongo (single-node replica set rs0) + SeaweedFS.
spring.mongodb.uri=mongodb://localhost:27017/aventyrs?replicaSet=rs0

seaweedfs.filer-url=http://localhost:8888
seaweedfs.s3.endpoint=http://localhost:8333
seaweedfs.s3.access-key=${AWS_ACCESS_KEY_ID:admin}
seaweedfs.s3.secret-key=${AWS_SECRET_ACCESS_KEY:secret}
seaweedfs.s3.bucket=${S3_BUCKET:my-bucket}

# Fixed, public dev signing key — never used outside dev (prod has no default, see application-prod).
aventyrs.security.jwt.secret=${JWT_SECRET:aventyrs-dev-only-jwt-signing-key-do-not-use-in-prod}
aventyrs.security.jwt.ttl=${JWT_TTL:24h}
